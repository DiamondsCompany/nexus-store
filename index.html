<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NEXUS STORE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* Layout: sticky navy header with hanging lights > banner > search > tabs > card grid; fixed 4-button bottom nav; sheets and modals above. Single committed icy-white/blue Christmas look. */
:root{
  --ice:#eef6ff; --ice2:#dcebff; --snow:#ffffff;
  --navy:#0a2a6e; --blue:#1d6bff; --blue2:#0a47d6; --sky:#5db4ff;
  --red:#e5283b; --green:#12a150; --gold:#f5b82e; --gold2:#ffe08a;
  --ink:#0e2147; --muted:#5b6f95; --line:#d3e3fb;
  --shadow:0 10px 28px rgba(14,60,150,.14);
  --display:'Orbitron',system-ui,sans-serif; --body:'Rajdhani',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--ice)}
body{margin:0;font:600 16px/1.35 var(--body);color:var(--ink);
  background-color:var(--ice);
  background-image:radial-gradient(1100px 480px at 50% -120px,#c6e0ff,transparent 70%),linear-gradient(#eef6ff,#ffffff 55%,#e6f1ff);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 130px;position:relative;overflow-x:hidden;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ice)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:0 auto;position:relative}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:10px;max-width:1100px;margin:0 auto}
.hbar{background:linear-gradient(135deg,#0a2a6e,#1553d6 60%,#2a7bff);border-radius:22px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:#fff;
  box-shadow:0 14px 30px rgba(10,50,140,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo b{font:900 17px var(--display);letter-spacing:.08em;white-space:nowrap;background:linear-gradient(90deg,#fff,#ffe08a,#fff,#ffe08a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.logo span{font-size:18px}
.logo .lt{display:flex;align-items:center;gap:6px;min-width:0}
.bal{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;cursor:pointer;line-height:1.1}
.bal small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.bal b{font:700 14px var(--display);color:var(--gold2)}
.hicons{display:flex;gap:8px;order:2}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;position:relative;cursor:pointer;transition:transform .15s,background .15s}
.ib:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.bd{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);font:700 11px/18px var(--body);text-align:center;padding:0 4px;box-shadow:0 0 0 2px #1553d6}
.lights{position:absolute;left:22px;right:22px;top:calc(100% - 4px);height:30px;display:flex;justify-content:space-between;pointer-events:none;overflow:hidden}
.lights::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#3a4a6a;border-radius:2px}
.bulb{width:9px;height:14px;margin-top:6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:currentColor;box-shadow:0 0 12px 2px currentColor;position:relative;animation:tw 1.8s ease-in-out infinite alternate}
.bulb::before{content:"";position:absolute;left:50%;top:-6px;width:4px;height:6px;margin-left:-2px;background:#3a4a6a}
.bulb:nth-child(4n+1){color:#ff3b4e}.bulb:nth-child(4n+2){color:#ffc83d;animation-delay:.5s}.bulb:nth-child(4n+3){color:#2ee27a;animation-delay:1s}.bulb:nth-child(4n){color:#5db4ff;animation-delay:.25s}

/* buttons */
.btn{font:700 15px var(--body);letter-spacing:.05em;text-transform:uppercase;color:#fff;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;
  background:linear-gradient(180deg,#5aa6ff 0%,#1d6bff 48%,#0a47d6 100%);
  box-shadow:0 5px 0 #08328f,0 12px 22px rgba(10,71,214,.35),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .12s,box-shadow .12s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #08328f,0 4px 10px rgba(10,71,214,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.red{background:linear-gradient(180deg,#ff6b7a,#e5283b 50%,#b3121f);box-shadow:0 5px 0 #7d0c16,0 12px 22px rgba(229,40,59,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.green{background:linear-gradient(180deg,#4fe08c,#12a150 50%,#0b7a3b);box-shadow:0 5px 0 #075a2a,0 12px 22px rgba(18,161,80,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold{background:linear-gradient(180deg,#fff0b3,#f5b82e 55%,#d9931a);color:#4a2f00;text-shadow:none;box-shadow:0 5px 0 #a8700d,0 12px 22px rgba(245,184,46,.35),inset 0 1px 0 rgba(255,255,255,.8)}
.btn.ghost{background:#fff;color:var(--blue2);text-shadow:none;box-shadow:0 4px 0 var(--line),0 8px 18px rgba(14,60,150,.12);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25),0 6px 12px rgba(10,71,214,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* banner */
.banner{margin-top:40px;position:relative;border-radius:28px;overflow:hidden;color:#fff;padding:26px 24px;display:grid;grid-template-columns:1.25fr .75fr;gap:10px;align-items:center;min-height:240px;
  background:radial-gradient(520px 240px at 88% 15%,rgba(255,224,138,.4),transparent 62%),linear-gradient(135deg,#0a2a6e 0%,#1553d6 55%,#3a8bff 100%);
  box-shadow:0 22px 44px rgba(10,50,140,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.banner::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(3px 3px at 90px 80px,#fff,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(2px 2px at 60px 140px,#fff,transparent),radial-gradient(3px 3px at 130px 110px,#fff,transparent);
  background-size:200px 180px;animation:fall 9s linear infinite}
.bt{position:relative;display:grid;gap:10px;justify-items:start;padding-right:8px}
.tag{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px}
.banner h1{font:900 clamp(22px,4.2vw,34px)/1.1 var(--display);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.banner p{max-width:46ch;opacity:.92;font-size:17px}
.cd{display:flex;gap:8px;align-items:stretch}
.cd div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:6px 12px;text-align:center;min-width:62px}
.cd b{display:block;font:900 20px var(--display);color:var(--gold2)}
.cd small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cd .cl{background:none;border:0;display:grid;align-items:center;font-size:14px;text-align:left;min-width:0;max-width:74px;line-height:1.1}
.bart{position:relative;justify-self:center;width:min(100%,230px);filter:drop-shadow(0 14px 18px rgba(0,0,0,.3));animation:float 5s ease-in-out infinite}

/* search + tabs */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:0 14px;box-shadow:var(--shadow);margin-top:20px;color:var(--blue2)}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(29,107,255,.15),var(--shadow)}
.search input{flex:1;min-width:0;height:52px;border:0;outline:0;background:none;font:700 17px var(--body);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--ice2);border-radius:18px;padding:6px;margin-top:16px;box-shadow:inset 0 2px 6px rgba(14,60,150,.12)}
.seg button{border:0;background:none;border-radius:14px;padding:11px;font:700 15px var(--display);letter-spacing:.06em;color:var(--muted);cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center;transition:all .2s}
.seg button[aria-pressed=true]{color:#fff;background:linear-gradient(180deg,#5aa6ff,#1d6bff 50%,#0a47d6);box-shadow:0 4px 0 #08328f,0 8px 16px rgba(10,71,214,.3)}
.h2{font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 2px}
.pt{font:900 clamp(22px,4vw,28px) var(--display);margin:34px 0 14px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.gc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;transform-style:preserve-3d;display:block;width:100%}
.gc:hover{box-shadow:0 18px 36px rgba(14,60,150,.22)}
.gc .art{aspect-ratio:4/3;border-radius:16px;overflow:hidden;position:relative;max-width:100%}
.gc .art svg,.gcv svg,.cic svg{width:100%;height:100%;display:block}
.gc.feat{grid-column:span 2}
.gc.feat .art{aspect-ratio:16/8}
.gi{padding:10px 6px 4px;display:grid;gap:1px}
.gi b{font:700 16px var(--display);letter-spacing:.02em}
.gi small{color:var(--muted);font-size:14px}
.rib{position:absolute;top:10px;left:10px;background:linear-gradient(#ff6b7a,#e5283b);color:#fff;font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(229,40,59,.4)}
.sup{margin-top:26px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.sup b{font:700 18px var(--display);color:var(--blue2);letter-spacing:.06em}
.sup small{color:var(--muted);display:block;font-size:15px}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{color:var(--ink);font:700 17px var(--display)}
.empty svg{width:90px;height:auto}

/* game page */
.gh{display:flex;align-items:center;gap:14px;margin-top:40px}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--blue2);box-shadow:var(--shadow);flex:none}
.gm{flex:1;min-width:0}
.gm h1{font:900 clamp(20px,4vw,28px) var(--display);letter-spacing:.03em}
.gm small{color:var(--muted);font-size:15px}
.gcv{width:84px;height:62px;border-radius:14px;overflow:hidden;flex:none;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
@media(min-width:900px){.cols{grid-template-columns:1fr 340px;gap:18px}.sumw{position:sticky;top:96px}}
.step{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.step h3{font:700 14px var(--display);letter-spacing:.06em;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.num{width:26px;height:26px;border-radius:50%;background:linear-gradient(#ff6b7a,#e5283b);color:#fff;display:grid;place-items:center;font:700 13px var(--display);flex:none;box-shadow:0 3px 8px rgba(229,40,59,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#f4f9ff;font:700 15px var(--body);cursor:pointer;color:var(--ink);transition:all .15s}
.chip:hover{border-color:var(--sky)}
.chip[aria-pressed=true]{border-color:var(--blue);background:#e3efff;color:var(--blue2);box-shadow:0 0 0 3px rgba(29,107,255,.15)}
.lb{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;display:block}
.in{width:100%;height:48px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:700 16px var(--body);background:#f4f9ff;color:var(--ink);outline:none;transition:border-color .15s}
.in:focus{border-color:var(--blue);background:#fff}
.row{display:flex;gap:10px;align-items:stretch}
.row .in{flex:1;min-width:0}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.err{color:var(--red);font-size:15px;min-height:0;margin-top:8px}
.okb{display:flex;gap:10px;align-items:center;background:#e8f8ef;border:1px solid #a9e3c1;color:#0b6b36;border-radius:14px;padding:10px 12px;margin-top:12px}
.okb small{display:block;color:#3f8a62}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}
.pk{position:relative;border-radius:20px;border:2px solid var(--line);background:linear-gradient(180deg,#fff,#eaf3ff);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 6px 14px rgba(14,60,150,.1)}
.pk:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(14,60,150,.2)}
.pk[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,184,46,.3),0 14px 26px rgba(14,60,150,.2);background:linear-gradient(180deg,#fffaf0,#fff0c7)}
.pk .am{font:900 20px var(--display);color:var(--navy)}
.pk .un{font-size:14px;color:var(--muted);text-align:center;line-height:1.1}
.price{margin-top:6px;padding:6px 14px;border-radius:12px;background:linear-gradient(#3ad77f,#12a150);color:#fff;font:700 15px var(--display);box-shadow:0 3px 0 #0b7a3b}
.pk .hot{position:absolute;top:-8px;right:8px;background:linear-gradient(#ff6b7a,#e5283b);color:#fff;font:700 10px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.sumw .step{margin-top:14px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ln span{color:var(--muted)}.ln b{text-align:right;min-width:0;overflow-wrap:anywhere}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px 0 12px;font:700 15px var(--display)}
.tot b{font-size:24px;color:var(--green)}
.btns{display:grid;gap:12px}

/* orders / wallet / profile */
.ord{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px;box-shadow:var(--shadow);display:grid;gap:10px}
.oh{display:flex;gap:12px;align-items:center}
.cic{width:56px;height:44px;border-radius:12px;overflow:hidden;flex:none}
.oh .om{flex:1;min-width:0}
.oh b{font:700 15px var(--display);display:block;overflow-wrap:anywhere}
.oh small{color:var(--muted);font-size:14px}
.pill{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap}
.st-pendiente{background:#fff4d6;color:#8a5a00}.st-completado{background:#dcf7e7;color:#0b6b36}.st-cancelado{background:#ffe0e3;color:#a3121f}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.wcard{position:relative;overflow:hidden;border-radius:26px;padding:22px;color:#fff;background:radial-gradient(300px 160px at 90% 0,rgba(255,224,138,.4),transparent 60%),linear-gradient(135deg,#0a2a6e,#1d6bff 60%,#5db4ff);box-shadow:0 22px 40px rgba(10,50,140,.35),inset 0 1px 0 rgba(255,255,255,.4);display:grid;gap:4px}
.wcard small{letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-size:13px}
.wb{font:900 clamp(32px,8vw,44px) var(--display);color:var(--gold2);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.wn{opacity:.9}
.wdeco{position:absolute;right:-10px;bottom:-14px;width:120px;opacity:.28;pointer-events:none}
.wacts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.wa{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 6px;display:grid;justify-items:center;gap:6px;cursor:pointer;color:var(--blue2);font:700 14px var(--body);box-shadow:var(--shadow);transition:transform .15s}
.wa:hover{transform:translateY(-3px)}
.wa i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#5aa6ff,#1d6bff 55%,#0a47d6);box-shadow:0 4px 0 #08328f}
.tx{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tx .tm{flex:1;min-width:0}.tx .tm b{display:block;overflow-wrap:anywhere}.tx .tm small{color:var(--muted);font-size:14px}
.tx .ta{font:700 15px var(--display);white-space:nowrap}
.up{color:var(--green)}.dn{color:var(--red)}
.tiu{background:#dcf7e7;color:var(--green)}.tid{background:#ffe0e3;color:var(--red)}.tip{background:#fff4d6;color:#8a5a00}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.me{display:flex;gap:16px;align-items:center}
.av{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font:900 26px var(--display);color:#fff;background:linear-gradient(135deg,#ff6b7a,#e5283b 45%,#f5b82e);box-shadow:0 8px 18px rgba(229,40,59,.35);flex:none;position:relative}
.av::after{content:"";position:absolute;inset:-4px;border-radius:26px;border:2px dashed rgba(245,184,46,.8)}
.me h2{font:900 20px var(--display);overflow-wrap:anywhere}
.me small{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:14px}
.stat{border-radius:20px;padding:14px;color:#fff;display:grid;gap:2px;background:linear-gradient(135deg,#0a2a6e,#1d6bff);box-shadow:var(--shadow)}
.stat:nth-child(2){background:linear-gradient(135deg,#0b7a3b,#2ecc71)}
.stat:nth-child(3){background:linear-gradient(135deg,#a3121f,#ff5468)}
.stat:nth-child(4){background:linear-gradient(135deg,#a8700d,#f5b82e)}
.stat small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.stat b{font:900 24px var(--display)}
.tgl{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;font:700 16px var(--body);text-align:left}
.tgl i{width:50px;height:28px;border-radius:999px;background:#c9d8f0;position:relative;transition:background .2s;flex:none}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .2s}
.tgl[aria-checked=true] i{background:var(--green)}
.tgl[aria-checked=true] i::after{transform:translateX(22px)}
.lnk{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;font:700 16px var(--body);text-align:left;color:var(--ink)}
.lnk:last-child,.tgl:last-child{border-bottom:0}
.lnk svg{color:var(--blue2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.tabs button{flex:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;font:700 14px var(--body);cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed=true]{border-color:var(--blue);color:var(--blue2);background:#e3efff}
.arow{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}

/* ---------- views ---------- */
function guest(t,p){return '<h1 class="pt">'+t+'</h1><div class="card"><div class="empty">'+TREE_S+'<b>Inicia sesión</b><p>'+p+'</p><button class="btn" data-act="authopen">Entrar o crear cuenta</button></div></div>'}

function cards(){
 var q=S.q.trim().toLowerCase();

  return (gm.length?'<h2 class="h2">Juegos</h2><div class="grid">'+gm.map(function(g){return card(g,'g')}).join('')+'</div>':'')+(gf.length?'<h2 class="h2">Gift Cards</h2><div class="grid">'+gf.map(function(g){return card(g,'c')}).join('')+'</div>':'')}

function vHome(){
 return '<section class="banner"><div class="bt"><span class="tag">❄ Temporada navideña</span><h1>Recarga diamantes y regala Navidad</h1><p>Free Fire y más juegos, gift cards y soporte directo al '+SUPPORT+'.</p><div class="cd" id="cd">'+cdHtml(xmasLeft())+'</div><button class="btn gold" data-act="open" data-k="g" data-id="freefire">Recargar Free Fire</button></div><div class="bart">'+TREE+'</div></section>'+
 '<div class="search">'+ic('search')+'<input id="q" type="search" placeholder="Buscar juegos y gift cards…" value="'+esc(S.q)+'" autocomplete="off" aria-label="Buscar juegos"></div>'+
 '<div class="seg" role="group" aria-label="Categoría"><button data-act="tab" data-v="g" aria-pressed="'+(S.tab==='g')+'">'+dia(20)+'Juegos</button><button data-act="tab" data-v="c" aria-pressed="'+(S.tab==='c')+'">'+giftIco(20)+'Gift Cards</button></div>'+

function payChips(act){var u=me();return Object.keys(PAY).map(function(k){return '<button class="chip" data-act="'+act+'" data-v="'+k+'" aria-pressed="'+(S.pay===k)+'">'+PAY[k]+(k==='wallet'&&u?' · '+money(u.balance):'')+'</button>'}).join('')}
function vbox(g){
 var f=S.f;
 if(!f.ok)return '<p class="'+(f.err?'err':'hint')+'">'+esc(f.err||('Escribe tu '+g.idLabel+' y pulsa Verificar.'))+'</p>';
 return '<div class="okb">'+ic('check',24)+'<div><b>'+esc(g.idLabel)+' válido</b><small>'+esc(f.pid)+' · '+esc(f.region)+'</small></div></div><label class="lb" for="nick">Nombre de la cuenta</label><input id="nick" class="in" data-in="nick" value="'+esc(f.nick)+'" placeholder="Como aparece en tu perfil del juego" maxlength="40"><p class="hint">Antes de entregar la recarga, el equipo comprueba que el nombre coincida con la cuenta.</p>'}
function sumHtml(g,isGift){
 var f=S.f,p=pkgs(g).find(function(x){return x.id===f.sel});var t=p?price(p):0;
 var rows=isGift?[['Producto',g.name],['Monto',p?p.label:'—'],['Pago',PAY[S.pay]]]:[['Juego',g.name],['Región',f.region],[g.idLabel,f.pid||'—'],['Cuenta',f.nick||'—'],['Paquete',p?p.label:'—'],['Pago',PAY[S.pay]]];
 return '<h3>Resumen</h3>'+rows.map(function(r){return '<div class="ln"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'}).join('')+'<div class="tot"><span>Total</span><b>'+money(t)+'</b></div><div class="btns"><button class="btn" data-act="addcart">'+ic('cart',18)+'Añadir al carrito</button><button class="btn red" data-act="buynow">Comprar ahora</button></div>'}
function pkCards(g){var f=S.f;return '<div class="pks">'+pkgs(g).map(function(p){return '<button class="pk" data-act="pkg" data-v="'+p.id+'" aria-pressed="'+(f.sel===p.id)+'">'+(p.hot?'<span class="hot">Popular</span>':'')+(p.card?giftIco(44):dia(44))+'<span class="am">'+(p.card?'':p.amt)+'</span><span class="un">'+(p.card?esc(p.label):(g.vals?'Gift Card':esc(g.unit)))+'</span><span class="price">'+money(price(p))+'</span></button>'}).join('')+'</div>'}
function vGame(g){
 var f=S.f;
 return '<div class="gh"><button class="back" data-act="home" aria-label="Volver">'+ic('back')+'</button><div class="gm"><h1>'+esc(g.name)+'</h1><small>Recarga de '+g.unit+' · entrega verificada por el equipo</small></div><div class="gcv">'+cover(g)+'</div></div>'+
 '<div class="cols"><div>'+
 '<section class="step"><h3><span class="num">1</span>Selecciona tu región</h3><div class="chips">'+REGIONS.map(function(r){return '<button class="chip" data-act="region" data-v="'+esc(r)+'" aria-pressed="'+(f.region===r)+'">'+esc(r)+'</button>'}).join('')+'</div></section>'+
 '<section class="step"><h3><span class="num">2</span>'+esc(g.idLabel)+'</h3><div class="row"><input id="pid" class="in" data-in="pid" '+(g.num?'inputmode="numeric" ':'')+'placeholder="'+esc(g.idPh)+'" value="'+esc(f.pid)+'" maxlength="30" aria-label="'+esc(g.idLabel)+'" autocomplete="off"><button class="btn" data-act="verify">Verificar</button></div><div id="vbox">'+vbox(g)+'</div></section>'+
 '<section class="step"><h3><span class="num">3</span>Método de pago</h3><div class="chips">'+payChips('pay')+'</div><p class="hint">'+(S.pay==='wallet'?'Se descuenta de tu saldo al confirmar.':'Pagas por transferencia y escribes la referencia al finalizar en el carrito.')+'</p></section>'+
 '<section class="step"><h3><span class="num">4</span>Elige tu paquete</h3><div id="pks">'+pkCards(g)+'</div></section>'+
 '</div><aside class="sumw"><div class="step" id="sum">'+sumHtml(g)+'</div></aside></div>'}
function vGift(g){
 var f=S.f;
 return '<div class="gh"><button class="back" data-act="home" aria-label="Volver">'+ic('back')+'</button><div class="gm"><h1>'+esc(g.name)+'</h1><small>Gift Card digital · el código se entrega en tu orden</small></div><div class="gcv">'+cover(g)+'</div></div>'+
 '<div class="cols"><div><section class="step"><h3><span class="num">1</span>Elige el monto</h3>'+pkCards(g)+'</section><section class="step"><h3><span class="num">2</span>Método de pago</h3><div class="chips">'+payChips('pay')+'</div></section></div><aside class="sumw"><div class="step" id="sum">'+sumHtml(g,true)+'</div></aside></div>'}

function stLabel(s){return {pendiente:'Pendiente',completado:'Completada',cancelado:'Cancelada'}[s]}
function vOrders(){
 var u=me();if(!u)return guest('Órdenes','Entra para ver tus compras completadas, pendientes y sus comprobantes.');
 var all=DB.orders.filter(function(o){return o.uid===u.id});
 var cnt=function(s){return s==='todas'?all.length:all.filter(function(o){return o.status===s}).length};
 var list=all.filter(function(o){return S.of==='todas'||o.status===S.of});
 var tabs=[['todas','Todas'],['pendiente','Pendientes'],['completado','Completadas'],['cancelado','Canceladas']];
 return '<h1 class="pt">Mis órdenes</h1><div class="tabs">'+tabs.map(function(t){return '<button data-act="ordf" data-v="'+t[0]+'" aria-pressed="'+(S.of===t[0])+'">'+t[1]+' ('+cnt(t[0])+')</button>'}).join('')+'</div>'+
 (list.length?list.map(function(o){var g=findItem(o.gid);return '<article class="ord"><div class="oh"><div class="cic">'+(g?cover(g):'')+'</div><div class="om"><b>'+esc(o.game)+' · '+esc(o.label)+'</b><small>'+esc(o.id)+' · '+fdate(o.t)+'</small></div><span class="pill st-'+o.status+'">'+stLabel(o.status)+'</span></div><div class="meta"><span>Total <b>'+money(o.price)+'</b></span><span>Pago <b>'+PAY[o.pay]+'</b></span>'+(o.status==='pendiente'?'<span><b>'+(o.paid?'Pago confirmado · recarga en proceso':'Esperando confirmación del pago')+'</b></span>':'')+'</div><div class="acts"><button class="btn ghost sm" data-act="receipt" data-id="'+o.id+'">Ver comprobante</button></div></article>'}).join(''):
 '<div class="card"><div class="empty">'+TREE_S+'<b>No hay órdenes aquí</b><p>Cuando compres una recarga aparecerá en esta lista.</p><button class="btn" data-act="home">Ir a comprar</button></div></div>')}

function vWallet(){

 var tx=DB.tx.filter(function(t){return t.uid===u.id}),dep=DB.deposits.filter(function(d){return d.uid===u.id&&d.status==='pendiente'});

 '<div class="wacts"><button class="wa" data-act="addfunds"><i>'+ic('plus')+'</i>Añadir fondos</button><button class="wa" data-act="sendm"><i>'+ic('send')+'</i>Enviar</button><button class="wa" data-act="hist"><i>'+ic('list')+'</i>Movimientos</button></div>'+

function toggle(k,label){return '<button class="tgl" role="switch" aria-checked="'+!!prefs()[k]+'" data-act="pref" data-k="'+k+'"><span>'+label+'</span><i></i></button>'}
function vProfile(){
 var u=me();if(!u)return guest('Perfil','Entra para ver tu información, tus recargas y tus ajustes.');
 var mine=DB.orders.filter(function(o){return o.uid===u.id}),done=mine.filter(function(o){return o.status==='completado'});
 var rech=done.filter(function(o){return o.type==='g'});
 var spent=done.reduce(function(s,o){return s+o.price},0);
 return '<h1 class="pt">Perfil</h1><div class="card" style="margin-top:0"><div class="me"><div class="av">'+esc(u.name.trim().charAt(0).toUpperCase())+'</div><div><h2>'+esc(u.name)+'</h2><small>'+esc(u.login)+'</small><br><small>Miembro desde '+new Date(u.created).toLocaleDateString('es',{day:'2-digit',month:'long',year:'numeric'})+'</small></div></div></div>'+

 '<div class="card"><h2 class="h2" style="margin-top:0">Recargas realizadas</h2>'+(rech.length?rech.slice(0,5).map(function(o){return '<div class="tx"><div class="ti tiu">'+ic('check',18)+'</div><div class="tm"><b>'+esc(o.game)+' · '+esc(o.label)+'</b><small>'+esc(o.pid)+' · '+fdate(o.t)+'</small></div><span class="ta">'+money(o.price)+'</span></div>'}).join(''):'<div class="empty"><p>Tus recargas completadas aparecerán aquí.</p></div>')+'</div>'+
 '<div class="card"><h2 class="h2" style="margin-top:0">Configuración</h2>'+toggle('snow','Nieve cayendo')+toggle('lights','Luces navideñas')+toggle('notifs','Mostrar avisos en pantalla')+
 '<button class="lnk" data-act="editname">'+ic('edit')+'Cambiar nombre</button><button class="lnk" data-act="passm">'+ic('key')+'Cambiar contraseña</button>'+(isAdmin()?'<button class="lnk" data-act="nav" data-to="admin">'+ic('shield')+'Panel de administración</button>':'')+'<button class="lnk" data-act="logout">'+ic('out')+'Cerrar sesión</button></div>'+

/* admin */
function aRes(){
 var pend=DB.orders.filter(function(o){return o.status==='pendiente'}).length,rev=DB.orders.filter(function(o){return o.status==='completado'}).reduce(function(s,o){return s+o.price},0),dp=DB.deposits.filter(function(d){return d.status==='pendiente'}).length;

function aOrd(){

 var l=DB.orders.filter(function(o){return S.af==='todas'||o.status===S.af});
 return '<div class="tabs">'+fs.map(function(t){return '<button data-act="af" data-v="'+t[0]+'" aria-pressed="'+(S.af===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'+
 (l.length?l.map(function(o){return '<article class="ord"><div class="oh"><div class="om"><b>'+esc(o.id)+' · '+esc(o.game)+' · '+esc(o.label)+'</b><small>'+esc(uname(o.uid))+' · '+fdate(o.t)+'</small></div><span class="pill st-'+o.status+'">'+stLabel(o.status)+'</span></div><div class="meta"><span>Total <b>'+money(o.price)+'</b></span><span>Pago <b>'+PAY[o.pay]+' '+(o.paid?'(confirmado)':'(sin confirmar)')+'</b></span>'+(o.ref?'<span>Ref <b>'+esc(o.ref)+'</b></span>':'')+'</div>'+(o.type==='g'?'<div class="meta"><span>Región <b>'+esc(o.region)+'</b></span><span>ID <b>'+esc(o.pid)+'</b></span><span>Cuenta <b>'+esc(o.nick)+'</b></span></div>':'')+
 '<input class="in" data-in="deliv" data-id="'+o.id+'" value="'+esc(o.delivery||'')+'" placeholder="'+(o.type==='c'?'Código de la gift card':'Nota de entrega (opcional)')+'" aria-label="Entrega">'+

function aDep(){
 var l=DB.deposits;
 return l.length?'<div class="card">'+l.map(function(d){return '<div class="arow"><div class="oh"><div class="om"><b>'+money(d.amount)+' · '+PAY[d.method]+'</b><small>'+esc(uname(d.uid))+' · Ref. '+esc(d.ref)+' · '+fdate(d.t)+'</small></div><span class="pill st-'+(d.status==='pendiente'?'pendiente':d.status==='aprobado'?'completado':'cancelado')+'">'+d.status+'</span></div>'+(d.status==='pendiente'?'<div class="acts"><button class="btn green sm" data-act="d-ok" data-id="'+d.id+'">Aprobar</button><button class="btn red sm" data-act="d-no" data-id="'+d.id+'">Rechazar</button></div>':'')+'</div>'}).join('')+'</div>':'<div class="card"><div class="empty"><p>No hay solicitudes de depósito.</p></div></div>'}
function aUsr(){
 return '<div class="card">'+DB.users.map(function(u){return '<div class="arow"><div class="oh"><div class="om"><b>'+esc(u.name)+(u.role==='admin'?' · Admin':'')+'</b><small>'+esc(u.login)+' · Saldo '+money(u.balance)+(u.banned?' · Suspendido':'')+'</small></div></div><div class="row"><input id="bal-'+u.id+'" class="in" type="number" min="0.01" step="0.01" placeholder="Añadir saldo ($)" aria-label="Añadir saldo a '+esc(u.name)+'"><button class="btn sm" data-act="u-bal" data-id="'+u.id+'">Añadir</button></div>'+(u.id!==DB.session?'<div class="acts"><button class="btn ghost sm" data-act="u-ban" data-id="'+u.id+'">'+(u.banned?'Reactivar':'Suspender')+'</button><button class="btn ghost sm" data-act="u-role" data-id="'+u.id+'">'+(u.role==='admin'?'Quitar admin':'Hacer admin')+'</button></div>':'')+'</div>'}).join('')+'</div>'}
function aPre(){
 var out='';
 GAMES.concat(GIFTS).forEach(function(g){out+='<div class="card"><h2 class="h2" style="margin-top:0">'+esc(g.name)+'</h2>'+pkgs(g).map(function(p){return '<div class="ln" style="align-items:center"><span>'+esc(p.label)+'</span><input class="in" style="width:110px;height:40px" type="number" min="0" step="0.01" data-in="price" data-id="'+p.id+'" value="'+price(p)+'" aria-label="Precio de '+esc(p.label)+'"></div>'}).join('')+'</div>'});
 return out}
function vAdmin(){
 var t=[['resumen','Resumen'],['pedidos','Pedidos'],['depositos','Depósitos'],['usuarios','Usuarios'],['precios','Precios']];
 var b=S.at==='resumen'?aRes():S.at==='pedidos'?aOrd():S.at==='depositos'?aDep():S.at==='usuarios'?aUsr():aPre();
 return '<h1 class="pt">Panel de administración</h1><div class="tabs">'+t.map(function(x){return '<button data-act="atab" data-v="'+x[0]+'" aria-pressed="'+(S.at===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+b}

function render(){
 var r=S.route,h;
 if(r==='juego'&&curGame())h=vGame(curGame());
 else if(r==='gift'&&curGift())h=vGift(curGift());
 else if(r==='ordenes')h=vOrders();
 else if(r==='wallet')h=vWallet();
 else if(r==='perfil')h=vProfile();
 else if(r==='admin'&&isAdmin())h=vAdmin();
 else h=vHome();
 $('#main').innerHTML=h;navActive()}
function navActive(){
 var map={inicio:'inicio',juego:'inicio',gift:'inicio',ordenes:'ordenes',wallet:'wallet',perfil:'perfil',admin:'perfil'};
 ['inicio','ordenes','wallet','perfil'].forEach(function(k){var b=$('#n-'+k);if(map[S.route]===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function refresh(){save();renderHdr();render()}

 else if(k==='nick'){S.f.nick=t.value;var s2=$('#sum');if(s2)s2.innerHTML=sumHtml(curGame())}
 else if(k==='ref')S.ref=t.value});
document.addEventListener('change',function(e){
 var t=e.target,k=t.dataset&&t.dataset.in;
 if(k==='deliv'){var o=findOrder(t.dataset.id);if(o){o.delivery=t.value.trim();save();toast('Entrega guardada')}}
 else if(k==='price'){var v=parseFloat(t.value);if(!(v>=0)){toast('Precio no válido');return}DB.prices[t.dataset.id]=Math.round(v*100)/100;save();toast('Precio actualizado')}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&(S.modal||S.sheet))closeOv();
 if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('.md')){var b=$('.md [data-primary]');if(b)b.click()}
 if(e.key==='Enter'&&e.target.id==='pid'){ACT.verify()}});
if(!reduce){
 document.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse')return;var t=e.target.closest&&e.target.closest('.tilt');if(!t)return;var r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform='perspective(700px) rotateX('+(-y*8)+'deg) rotateY('+(x*10)+'deg) translateY(-3px)'});
 document.addEventListener('pointerout',function(e){var t=e.target.closest&&e.target.closest('.tilt');if(t&&!t.contains(e.relatedTarget))t.style.transform=''})}

/* ---------- boot ---------- */
DB=load()||seed();
DB.gp=DB.gp||{snow:true,lights:true,notifs:true};DB.prices=DB.prices||{};DB.carts=DB.carts||{};
if(DB.session&&!me())DB.session=null;
resetForm();rs();window.addEventListener('resize',rs);
window.addEventListener('hashchange',onHash);
renderHdr();onHash();applyPrefs();
setInterval(function(){var c=$('#cd');if(c)c.innerHTML=cdHtml(xmasLeft())},30000);
})();
